<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="head" cx="38%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#FFE6BD"/>
      <stop offset="45%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7EDF3"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="wattle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="62" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <!-- kepala ayam -->
  <circle cx="64" cy="72" r="34" fill="url(#head)"/>
  <!-- highlight -->
  <ellipse cx="49" cy="53" rx="12" ry="7" fill="#FFFFFF" opacity="0.45" transform="rotate(-24 49 53)"/>
  <!-- topi koki -->
  <g fill="url(#hat)" transform="rotate(-7 64 34)">
    <circle cx="47" cy="27" r="11"/>
    <circle cx="65" cy="20" r="13"/>
    <circle cx="81" cy="28" r="10"/>
    <path d="M41 32 q24 -18 47 0 l0 10 q-24 -10 -47 0 z"/>
    <rect x="44" y="38" width="41" height="10" rx="5"/>
  </g>
  <!-- mata -->
  <ellipse cx="53" cy="71" rx="5.5" ry="6" fill="#451A03"/>
  <ellipse cx="75" cy="71" rx="5.5" ry="6" fill="#451A03"/>
  <circle cx="51" cy="69" r="1.9" fill="#FFFFFF"/>
  <circle cx="73" cy="69" r="1.9" fill="#FFFFFF"/>
  <!-- pipi -->
  <ellipse cx="44" cy="81" rx="5" ry="3.4" fill="#F43F5E" opacity="0.32"/>
  <ellipse cx="84" cy="81" rx="5" ry="3.4" fill="#F43F5E" opacity="0.32"/>
  <!-- paruh -->
  <path d="M56 78 L72 78 L64 86 Z" fill="url(#beak)"/>
  <path d="M60 85 L68 85 L64 90 Z" fill="#D97706"/>
  <!-- pial -->
  <path d="M64 90 q4 2.5 3.2 6.5 q-0.8 4 -3.2 4 q-2.4 0 -3.2 -4 q-0.8 -4 3.2 -6.5 z" fill="url(#wattle)"/>
  <!-- syal hijau sambal ijo -->
  <path d="M38 100 Q64 114 90 100 L90 107 Q64 122 38 107 Z" fill="url(#green)"/>
  <path d="M84 108 l11 8 l-8 1 l-1.6 7 z" fill="#16A34A"/>
